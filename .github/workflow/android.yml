name: Build VIQ Android APK
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Your live HTTPS Render origin (example https://viq-name.onrender.com)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable test APK
        working-directory: android
        env:
          VIQ_APP_URL: ${{ inputs.app_url }}
        run: gradle --no-daemon assembleDebug -PVIQ_URL="$VIQ_APP_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: VIQ-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
