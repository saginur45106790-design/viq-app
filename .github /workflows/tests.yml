name: VIQ backend checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: viq
          POSTGRES_PASSWORD: local_ci_password
          POSTGRES_DB: viq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest==8.4.2
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://viq:local_ci_password@localhost:5432/viq_test
